<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<title>隨手掃描</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="用手機拍照掃描文件：自動找出紙張邊緣、拉正、變清晰，一鍵存成 PDF。所有處理都在手機上完成，不會上傳。">
<meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="隨手掃描">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Layout: app shell — top bar, scrollable page grid, fixed bottom action bar.
   The editor is a full-screen dark overlay (crop step → filter step), like a camera app. */
:root {
  --bg: #F3F4F6; --card: #FFFFFF; --ink: #16191D; --muted: #5D6570; --line: #DCE0E5;
  --accent: #0B7A63; --accent-ink: #FFFFFF; --accent-soft: #DDF0EA;
  --danger: #B93A2C; --scrim: rgba(12, 14, 16, .55); --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.06);
  --font: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  --sb: env(safe-area-inset-bottom, 0px);
  --st: env(safe-area-inset-top, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15171A; --card: #1F2226; --ink: #ECEEF1; --muted: #A0A7B0; --line: #33373D;
  --accent: #3FBF9C; --accent-ink: #062B22; --accent-soft: #19362F;
  --danger: #EF7A6B; --scrim: rgba(0,0,0,.65); --shadow: none; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #15171A; --card: #1F2226; --ink: #ECEEF1; --muted: #A0A7B0; --line: #33373D;
  --accent: #3FBF9C; --accent-ink: #062B22; --accent-soft: #19362F;
  --danger: #EF7A6B; --scrim: rgba(0,0,0,.65); --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font);
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
  display: flex; flex-direction: column; min-height: 100dvh;
}
button { font: inherit; color: inherit; cursor: pointer; }
svg.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* top bar */
.top {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: calc(var(--st) + 10px) var(--gr) 10px var(--gl);
  display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line);
}
.top h1 { margin: 0; font-size: 20px; font-weight: 700; flex: 1; display: flex; align-items: center; gap: 8px; }
.top h1 svg { color: var(--accent); }
.ghost {
  background: none; border: 0; padding: 8px 10px; border-radius: 10px; color: var(--muted);
  display: inline-flex; align-items: center; gap: 6px; font-size: 15px;
}
.ghost:hover { background: var(--line); }

/* page grid */
main { flex: 1; padding: 16px var(--gr) calc(110px + var(--sb)) var(--gl); width: 100%; max-width: 960px; margin: 0 auto; }
.count { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
.card { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; }
.thumb { border: 0; padding: 10px 10px 0; background: none; position: relative; display: block; }
.thumb img { width: 100%; aspect-ratio: 1 / 1.35; object-fit: contain; display: block; background: var(--bg); border-radius: 6px; }
.num {
  position: absolute; right: 16px; bottom: 6px; background: var(--ink); color: var(--bg);
  font-size: 12px; font-weight: 700; min-width: 24px; height: 24px; border-radius: 12px;
  display: grid; place-items: center; padding: 0 7px; opacity: .85;
}
.acts { display: flex; justify-content: space-between; padding: 4px 4px; }
.acts button { background: none; border: 0; padding: 8px; border-radius: 8px; color: var(--muted); display: grid; place-items: center; }
.acts button:hover:not(:disabled) { background: var(--bg); color: var(--ink); }
.acts button:disabled { opacity: .3; cursor: default; }
.acts .del:hover { color: var(--danger) !important; }

.empty { text-align: center; padding: 40px 8px 20px; max-width: 420px; margin: 0 auto; }
.empty .art { width: 120px; height: 120px; margin: 0 auto 18px; color: var(--accent); }
.empty h2 { margin: 0 0 8px; font-size: 22px; }
.empty p { margin: 0 0 22px; color: var(--muted); }
.steps { list-style: none; padding: 0; margin: 0; text-align: left; display: grid; gap: 10px; }
.steps li { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
.steps b { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; font-size: 14px; }
.steps span { font-size: 15px; }
.privacy { font-size: 13px; color: var(--muted); margin-top: 18px !important; }

/* bottom bar */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding: 12px var(--gr) calc(12px + var(--sb)) var(--gl);
  display: flex; gap: 10px; justify-content: center;
}
.bar > * { max-width: 300px; }
.btn {
  flex: 1; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  border-radius: 14px; padding: 12px 10px; font-weight: 600; font-size: 15px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 52px; white-space: nowrap;
}
.bar .btn { padding: 12px 6px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.big { flex: 1.4; }

/* editor (always dark, like a camera) */
.editor {
  position: fixed; inset: 0; z-index: 20; background: #0E0F11; color: #F2F3F5;
  display: flex; flex-direction: column; color-scheme: dark;
}
.ehead { padding: calc(var(--st) + 8px) var(--gr) 8px var(--gl); display: flex; align-items: center; gap: 8px; }
.ehead h2 { flex: 1; margin: 0; font-size: 17px; font-weight: 600; text-align: center; }
.ehead .ghost { color: #C8CCD2; }
.ehead .ghost:hover { background: #24272B; }
.stage { flex: 1; position: relative; min-height: 0; overflow: hidden; touch-action: none; }
.cropbox { position: absolute; }
.cropbox img { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; pointer-events: none; }
.cropbox svg { position: absolute; inset: -30px; width: calc(100% + 60px); height: calc(100% + 60px); overflow: visible; touch-action: none; }
.quad { fill: rgba(63, 191, 156, .16); stroke: #3FBF9C; stroke-width: 2; }
.quad.bad { fill: rgba(239, 122, 107, .18); stroke: #EF7A6B; }
.handle { fill: rgba(14, 15, 17, .35); stroke: #FFFFFF; stroke-width: 2.5; }
.handle.on { fill: #3FBF9C; }
.loupe {
  position: absolute; top: 10px; width: 120px; height: 120px; border-radius: 50%;
  border: 3px solid #FFFFFF; box-shadow: 0 4px 16px rgba(0,0,0,.5); pointer-events: none; background: #000;
}
.preview { position: absolute; inset: 12px var(--gr) 12px var(--gl); display: grid; place-items: center; }
.preview img { max-width: 100%; max-height: 100%; display: block; box-shadow: 0 6px 24px rgba(0,0,0,.5); background: #fff; }
.tools { display: flex; gap: 8px; justify-content: center; padding: 10px var(--gr) 4px var(--gl); flex-wrap: wrap; }
.chip {
  border: 1px solid #3A3E44; background: #1C1F23; color: #E4E7EB; border-radius: 999px;
  padding: 8px 14px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; min-height: 40px;
}
.chip[aria-pressed="true"] { background: #3FBF9C; border-color: #3FBF9C; color: #062B22; font-weight: 600; }
.chip svg.i { width: 18px; height: 18px; }
.ebar { display: flex; gap: 10px; padding: 10px var(--gr) calc(12px + var(--sb)) var(--gl); justify-content: center; }
.ebar .btn { background: #1C1F23; border-color: #3A3E44; color: #F2F3F5; max-width: 240px; }
.ebar .btn.primary { background: #3FBF9C; border-color: #3FBF9C; color: #062B22; }
.hint { text-align: center; font-size: 13px; color: #9AA1AA; margin: 0; padding: 0 16px; min-height: 20px; }

/* sheet (export) */
.scrim { position: fixed; inset: 0; z-index: 30; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--card); width: 100%; max-width: 520px; border-radius: 20px 20px 0 0;
  padding: 20px var(--gr) calc(20px + var(--sb)) var(--gl); max-height: 92dvh; overflow: auto;
}
@media (min-width: 600px) { .scrim { align-items: center; } .sheet { border-radius: 20px; padding: 24px; } }
.sheet h2 { margin: 0 0 16px; font-size: 20px; display: flex; align-items: center; }
.sheet h2 span { flex: 1; }
.field { margin-bottom: 16px; }
.field > label, .field > .lab { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
.namebox { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding-right: 12px; }
.namebox input { flex: 1; min-width: 0; border: 0; background: none; color: var(--ink); font: inherit; font-size: 16px; padding: 12px; outline: none; }
.namebox:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.namebox span { color: var(--muted); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--bg); padding: 4px; border-radius: 12px; border: 1px solid var(--line); }
.seg button { border: 0; background: none; padding: 9px 4px; border-radius: 9px; font-size: 14px; color: var(--muted); line-height: 1.3; }
.seg button small { display: block; font-size: 11.5px; opacity: .8; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.result { background: var(--accent-soft); border-radius: 14px; padding: 14px; margin-top: 6px; }
.result p { margin: 0 0 12px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.result .row { display: flex; gap: 10px; }

/* busy + toast */
.busy { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: grid; place-items: center; }
.busy div { background: var(--card); color: var(--ink); border-radius: 16px; padding: 22px 28px; display: flex; gap: 14px; align-items: center; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast {
  position: fixed; left: 50%; bottom: calc(96px + var(--sb)); transform: translateX(-50%); z-index: 60;
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-size: 15px;
  max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.25);
}
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
</style>
</head>
<body>

<header class="top">
  <h1><svg class="i" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></svg>隨手掃描</h1>
  <button class="ghost" id="clearAll" hidden><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>全部清除</button>
</header>

<main>
  <section id="empty" class="empty">
    <svg class="art" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 22l52-6 10 82-56 6z" fill="currentColor" fill-opacity=".1"/>
      <path d="M42 40l30-3.5M43.5 52l30-3.5M45 64l22-2.5M46.5 76l26-3"/>
      <path d="M14 30V16a4 4 0 0 1 4-4h14M88 12h14a4 4 0 0 1 4 4v14M106 90v14a4 4 0 0 1-4 4H88M32 108H18a4 4 0 0 1-4-4V90"/>
    </svg>
    <h2>拍下文件，存成 PDF</h2>
    <p>自動找出紙張邊緣、把歪斜拉正、讓字變清楚。</p>
    <ol class="steps">
      <li><b>1</b><span>按「拍照」拍文件，或從相簿選照片（可一次選多張）</span></li>
      <li><b>2</b><span>確認四個角、選濾鏡（增強／灰階／黑白）</span></li>
      <li><b>3</b><span>按「存成 PDF」下載或分享</span></li>
    </ol>
    <p class="privacy">照片只在這支手機上處理，不會上傳到任何地方。</p>
  </section>
  <section id="pagesWrap" hidden>
    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer class="bar">
  <button class="btn primary big" id="btnCam"><svg class="i" viewBox="0 0 24 24"><path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>拍照</button>
  <button class="btn" id="btnAlbum"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-9 9"/></svg>相簿</button>
  <button class="btn" id="btnPdf" disabled><svg class="i" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 12v6M9 15l3 3 3-3"/></svg>存成 PDF</button>
</footer>
<input type="file" id="inCam" accept="image/*" capture="environment" hidden>
<input type="file" id="inAlbum" accept="image/*" multiple hidden>

<!-- editor -->
<section class="editor" id="editor" hidden>
  <div class="ehead">
    <button class="ghost" id="edBack"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg><span id="edBackLabel">取消</span></button>
    <h2 id="edTitle">調整四個角</h2>
    <button class="ghost" id="edDel" aria-label="刪除這頁"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>
  </div>
  <div class="stage" id="stage">
    <div class="cropbox" id="cropbox">
      <img id="cropImg" alt="">
      <svg id="cropSvg">
        <polygon class="quad" id="quad"/>
        <g id="handles"></g>
      </svg>
    </div>
    <canvas class="loupe" id="loupe" width="240" height="240" hidden></canvas>
    <div class="preview" id="preview" hidden><img id="previewImg" alt="掃描結果預覽"></div>
  </div>
  <p class="hint" id="hint">拖曳圓點對齊紙張的四個角</p>
  <div class="tools" id="cropTools">
    <button class="chip" id="tAuto"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8zM18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9z"/></svg>自動偵測</button>
    <button class="chip" id="tFull"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>整張照片</button>
  </div>
  <div class="tools" id="filterTools" hidden>
    <button class="chip" data-f="enhance">增強</button>
    <button class="chip" data-f="bw">黑白</button>
    <button class="chip" data-f="gray">灰階</button>
    <button class="chip" data-f="none">原圖</button>
    <button class="chip" id="tRot"><svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>旋轉</button>
  </div>
  <div class="ebar">
    <button class="btn primary" id="edNext">下一步<svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
</section>

<!-- export sheet -->
<div class="scrim" id="exportScrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="exTitle">
    <h2><span id="exTitle">存成 PDF</span><button class="ghost" id="exClose" aria-label="關閉"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h2>
    <div class="field">
      <label for="exName">檔名</label>
      <div class="namebox"><input id="exName" autocomplete="off" enterkeyhint="done"><span>.pdf</span></div>
    </div>
    <div class="field">
      <span class="lab">紙張大小</span>
      <div class="seg" id="segSize">
        <button data-v="a4" aria-pressed="true">A4<small>放進 A4 紙</small></button>
        <button data-v="fit" aria-pressed="false">依照片<small>不留白邊</small></button>
      </div>
    </div>
    <div class="field">
      <span class="lab">畫質</span>
      <div class="seg" id="segQ">
        <button data-v="high" aria-pressed="false">高畫質<small>檔案較大</small></button>
        <button data-v="std" aria-pressed="true">標準<small>建議</small></button>
        <button data-v="small" aria-pressed="false">精簡<small>適合寄信</small></button>
      </div>
    </div>
    <button class="btn primary" id="exMake" style="width:100%">產生 PDF</button>
    <div class="result" id="exResult" hidden>
      <p><svg class="i" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg><span id="exInfo"></span></p>
      <div class="row">
        <button class="btn primary" id="exDownload"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>下載</button>
        <button class="btn" id="exShare" hidden><svg class="i" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></svg>分享／存到檔案</button>
      </div>
    </div>
  </div>
</div>

<div class="busy" id="busy" hidden><div><span class="spin"></span><span id="busyText">處理中…</span></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
/* ============ settings ============ */
const MAX_SRC = 2400;          // longest side kept from the original photo
const MAX_OUT = 2200;          // longest side of a processed page
const QUALITY = { high: [2200, 0.9], std: [1700, 0.8], small: [1200, 0.62] };
const FULL = [[0, 0], [1, 0], [1, 1], [0, 1]];

const $ = id => document.getElementById(id);
let pages = [];                // {id, order, src, srcW, srcH, corners, rot, filter, out, outW, outH, url}
let ed = null;                 // editor state

/* ============ small helpers ============ */
const tick = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
function busy(text) { if (text === false) { $("busy").hidden = true; return; } $("busyText").textContent = text || "處理中…"; $("busy").hidden = false; }
let toastTimer;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function makeCanvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
function freeCanvas(c) { if (c) { c.width = 0; c.height = 0; } }
function loadImage(blob) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("無法讀取圖片")); };
    img.src = url;
  });
}
function toBlob(canvas, q) {
  return new Promise((res, rej) => canvas.toBlob(b => b ? res(b) : rej(new Error("編碼失敗")), "image/jpeg", q));
}
function imageToCanvas(img, maxSide) {
  const w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, maxSide / Math.max(w, h));
  const c = makeCanvas(Math.max(1, Math.round(w * s)), Math.max(1, Math.round(h * s)));
  const ctx = c.getContext("2d"); ctx.imageSmoothingQuality = "high"; ctx.drawImage(img, 0, 0, c.width, c.height);
  return c;
}

  const added = [];

    for (let i = 0; i < files.length; i++) {
      busy(files.length > 1 ? `處理中 ${i + 1}／${files.length}` : "處理中…"); await tick();
      let img;
      try { img = await loadImage(files[i]); } catch { toast(`第 ${i + 1} 張照片無法讀取（格式不支援）`); continue; }
      const src = imageToCanvas(img, MAX_SRC);
      const page = {
        id: uid(), order: pages.length, src: await toBlob(src, 0.92), srcW: src.width, srcH: src.height,
        corners: detectCorners(src) || FULL.map(p => p.slice()), rot: 0, filter: "enhance"

    $("edTitle").textContent = "選擇濾鏡"; $("edBackLabel").textContent = "裁切";
    $("edNext").innerHTML = '<svg class="i" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>完成';
    $("hint").textContent = "增強：適合一般文件 · 黑白：最清楚、檔案最小";
    await updatePreview();
  } catch (e) { console.error(e); toast("處理失敗：" + e.message); }
  busy(false);
}
async function updatePreview() {
  document.querySelectorAll("#filterTools [data-f]").forEach(b => b.setAttribute("aria-pressed", b.dataset.f === ed.filter));
  const c = rotated(ed.warped, ed.rot); applyFilter(c, ed.filter);
  const b = await toBlob(c, 0.85); freeCanvas(c);
  const img = $("previewImg"); if (img.src.startsWith("blob:")) URL.revokeObjectURL(img.src);
  img.src = URL.createObjectURL(b);
}
async function finishEdit() {
  const p = ed.page;
  busy("儲存中…"); await tick();
  try {
    p.corners = ed.corners; p.rot = ed.rot; p.filter = ed.filter;
    await renderPage(p, ed.warped); await savePage(p);
  } catch (e) { console.error(e); toast("儲存失敗：" + e.message); }
  busy(false); closeEditor(false); renderList();
}

/* crop handles */
function layoutCrop() {
  if (!ed || ed.step !== "crop") return;
  const img = $("cropImg"), st = $("stage");
  const nw = img.naturalWidth || ed.page.srcW, nh = img.naturalHeight || ed.page.srcH;
  const pad = 28, aw = st.clientWidth - pad * 2, ah = st.clientHeight - pad * 2;
  const s = Math.min(aw / nw, ah / nh);
  const w = Math.max(1, nw * s), h = Math.max(1, nh * s);
  const box = $("cropbox");
  box.style.width = w + "px"; box.style.height = h + "px";
  box.style.left = (st.clientWidth - w) / 2 + "px"; box.style.top = (st.clientHeight - h) / 2 + "px";
  ed.dw = w; ed.dh = h;
  drawQuad();
}
function drawQuad() {
  const P = ed.corners.map(([x, y]) => [x * ed.dw + 30, y * ed.dh + 30]);
  const quad = $("quad");
  quad.setAttribute("points", P.map(p => p.join(",")).join(" "));
  quad.classList.toggle("bad", !isConvex(ed.corners));
  $("handles").innerHTML = P.map((p, i) => `<circle class="handle${ed.drag === i ? " on" : ""}" cx="${p[0]}" cy="${p[1]}" r="12"/>`).join("");
}
function pointerPos(e) { const r = $("cropbox").getBoundingClientRect(); return [(e.clientX - r.left) / ed.dw, (e.clientY - r.top) / ed.dh]; }
$("cropSvg").addEventListener("pointerdown", e => {
  if (!ed || ed.step !== "crop") return;
  const [x, y] = pointerPos(e);
  let best = -1, bd = 48;
  ed.corners.forEach(([cx, cy], i) => { const d = Math.hypot((cx - x) * ed.dw, (cy - y) * ed.dh); if (d < bd) { bd = d; best = i; } });
  if (best < 0) return;
  e.preventDefault();
  ed.drag = best; ed.grab = [ed.corners[best][0] - x, ed.corners[best][1] - y];
  $("cropSvg").setPointerCapture(e.pointerId);
  drawQuad(); drawLoupe(e);
});
$("cropSvg").addEventListener("pointermove", e => {
  if (!ed || ed.drag < 0) return;
  const [x, y] = pointerPos(e);
  ed.corners[ed.drag] = [Math.min(1, Math.max(0, x + ed.grab[0])), Math.min(1, Math.max(0, y + ed.grab[1]))];
  drawQuad(); drawLoupe(e);
});
const endDrag = () => { if (!ed) return; ed.drag = -1; $("loupe").hidden = true; drawQuad(); };
$("cropSvg").addEventListener("pointerup", endDrag);
$("cropSvg").addEventListener("pointercancel", endDrag);
function drawLoupe(e) {
  const lp = $("loupe"), img = $("cropImg");
  if (!img.naturalWidth) return;
  lp.hidden = false;
  const st = $("stage").getBoundingClientRect();
  lp.style.left = (e.clientX - st.left < st.width / 2) ? "" : "10px";
  lp.style.right = (e.clientX - st.left < st.width / 2) ? "10px" : "";
  const ctx = lp.getContext("2d"), S = lp.width, [cx, cy] = ed.corners[ed.drag];
  const span = 60 * img.naturalWidth / ed.dw;  // ≈ 60 screen px of the photo around the corner
  ctx.save(); ctx.fillStyle = "#000"; ctx.fillRect(0, 0, S, S);
  ctx.beginPath(); ctx.arc(S / 2, S / 2, S / 2, 0, Math.PI * 2); ctx.clip();
  ctx.drawImage(img, cx * img.naturalWidth - span / 2, cy * img.naturalHeight - span / 2, span, span, 0, 0, S, S);
  ctx.strokeStyle = "#3FBF9C"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(S / 2, S / 2 - 26); ctx.lineTo(S / 2, S / 2 + 26); ctx.moveTo(S / 2 - 26, S / 2); ctx.lineTo(S / 2 + 26, S / 2); ctx.stroke();
  ctx.restore();
}

$("tAuto").onclick = async () => {
  busy(); await tick();
  if (!ed.src) ed.src = imageToCanvas(await loadImage(ed.page.src), MAX_SRC);
  const q = detectCorners(ed.src); busy(false);
  if (q) { ed.corners = q; drawQuad(); } else toast("找不到明顯的紙張邊緣，請手動調整");
};
$("tFull").onclick = () => { ed.corners = FULL.map(p => p.slice()); drawQuad(); };
$("tRot").onclick = async () => { ed.rot = (ed.rot + 90) % 360; await updatePreview(); };
document.querySelectorAll("#filterTools [data-f]").forEach(b => b.onclick = async () => { ed.filter = b.dataset.f; await updatePreview(); });
$("edNext").onclick = () => ed.step === "crop" ? showFilter() : finishEdit();
$("edBack").onclick = () => ed.step === "filter" ? showCrop() : closeEditor(false);
$("edDel").onclick = async () => { const p = ed.page; if (await removePage(p, true)) closeEditor(false); };
window.addEventListener("resize", () => { if (ed) layoutCrop(); });
window.addEventListener("popstate", () => { if (!$("exportScrim").hidden) closeExport(true); else if (ed) closeEditor(true); });

/* ============ PDF ============ */
function pdfDate(d) { const z = n => String(n).padStart(2, "0"); return `D:${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`; }
function pdfText(s) {  // UTF-16BE hex string, so Chinese titles work
  let h = "FEFF";
  for (const ch of s) { const cp = ch.codePointAt(0); const units = cp > 0xFFFF ? [0xD800 + ((cp - 0x10000) >> 10), 0xDC00 + ((cp - 0x10000) & 0x3FF)] : [cp]; for (const u of units) h += u.toString(16).toUpperCase().padStart(4, "0"); }
  return `<${h}>`;
}
function buildPdf(images, size, title) {
  const enc = new TextEncoder(), parts = [], offsets = [];
  let pos = 0;
  const put = x => { const b = typeof x === "string" ? enc.encode(x) : x; parts.push(b); pos += b.length; };
  const obj = (n, body) => { offsets[n] = pos; put(`${n} 0 obj\n${body}\nendobj\n`); };
  put("%PDF-1.4\n"); put(new Uint8Array([37, 226, 227, 207, 211, 10]));
  const n = images.length, f = v => (Math.round(v * 100) / 100).toString();
  obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
  obj(2, `<< /Type /Pages /Count ${n} /Kids [${images.map((_, i) => `${4 + i * 3} 0 R`).join(" ")}] >>`);
  obj(3, `<< /Title ${pdfText(title)} /Producer (Pocket Scanner) /CreationDate (${pdfDate(new Date())}) >>`);
  images.forEach((im, i) => {
    const pn = 4 + i * 3;
    let pw, ph, dw, dh, x, y;
    if (size === "a4") {
      [pw, ph] = im.w > im.h ? [841.89, 595.28] : [595.28, 841.89];
      const s = Math.min(pw / im.w, ph / im.h); dw = im.w * s; dh = im.h * s; x = (pw - dw) / 2; y = (ph - dh) / 2;
    } else {
      const s = 72 / 200; pw = dw = im.w * s; ph = dh = im.h * s; x = y = 0;  // treat the scan as 200 dpi
    }
    obj(pn, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${f(pw)} ${f(ph)}] /Resources << /XObject << /Im0 ${pn + 2} 0 R >> >> /Contents ${pn + 1} 0 R >>`);
    const cs = `q ${f(dw)} 0 0 ${f(dh)} ${f(x)} ${f(y)} cm /Im0 Do Q`;
    obj(pn + 1, `<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    offsets[pn + 2] = pos;
    put(`${pn + 2} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`);
    put(im.bytes); put("\nendstream\nendobj\n");
  });
  const total = 4 + n * 3, xref = pos;
  let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for (let i = 1; i < total; i++) x += `${String(offsets[i]).padStart(10, "0")} 00000 n \n`;
  put(x); put(`trailer\n<< /Size ${total} /Root 1 0 R /Info 3 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, { type: "application/pdf" });
}
function defaultName() { const d = new Date(), z = n => String(n).padStart(2, "0"); return `掃描_${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}`; }
function fileName() { const n = ($("exName").value.trim() || defaultName()).replace(/[\\/:*?"<>|]+/g, "_").replace(/\.pdf$/i, ""); return n + ".pdf"; }
function segVal(id) { return document.querySelector(`#${id} [aria-pressed="true"]`).dataset.v; }
let pdfOut = null;
function openExport() {
  $("exName").value = defaultName(); $("exResult").hidden = true; pdfOut = null;
  $("exportScrim").hidden = false; history.pushState({ sheet: 1 }, "");
}
function closeExport(fromPop) { $("exportScrim").hidden = true; pdfOut = null; if (!fromPop) history.back(); }
document.querySelectorAll(".seg").forEach(seg => seg.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); $("exResult").hidden = true; pdfOut = null;
}));
$("exName").addEventListener("input", () => { if (pdfOut) pdfOut.name = fileName(); });
$("exMake").onclick = async () => {
  const [maxSide, q] = QUALITY[segVal("segQ")], size = segVal("segSize"), images = [];
  try {
    for (let i = 0; i < pages.length; i++) {
      busy(`產生 PDF ${i + 1}／${pages.length}`); await tick();
      const p = pages[i]; let blob = p.out, w = p.outW, h = p.outH;
      if (maxSide < MAX_OUT || q < 0.9) {
        const c = imageToCanvas(await loadImage(p.out), maxSide); blob = await toBlob(c, q); w = c.width; h = c.height; freeCanvas(c);
      }
      images.push({ bytes: new Uint8Array(await blob.arrayBuffer()), w, h });
    }
    const name = fileName(), blob = buildPdf(images, size, name.replace(/\.pdf$/, ""));
    pdfOut = { blob, name };
    const mb = blob.size / 1048576;
    $("exInfo").textContent = `${pages.length} 頁 · ${mb >= 1 ? mb.toFixed(1) + " MB" : Math.max(1, Math.round(blob.size / 1024)) + " KB"}`;
    const file = new File([blob], name, { type: "application/pdf" });
    $("exShare").hidden = !(navigator.canShare && navigator.canShare({ files: [file] }));
    $("exResult").hidden = false;
  } catch (e) { console.error(e); toast("產生 PDF 失敗：" + e.message); }
  busy(false);
};
$("exDownload").onclick = () => {
  if (!pdfOut) return;
  const a = document.createElement("a"), url = URL.createObjectURL(pdfOut.blob);
  a.href = url; a.download = fileName(); document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  toast("已下載 " + fileName());
};
$("exShare").onclick = async () => {
  if (!pdfOut) return;
  try { await navigator.share({ files: [new File([pdfOut.blob], fileName(), { type: "application/pdf" })], title: fileName() }); }
  catch (e) { if (e.name !== "AbortError") toast("無法分享：" + e.message); }
};
$("exClose").onclick = () => closeExport(false);
$("exportScrim").addEventListener("click", e => { if (e.target === $("exportScrim")) closeExport(false); });

/* ============ main buttons ============ */
$("btnCam").onclick = () => $("inCam").click();
$("btnAlbum").onclick = () => $("inAlbum").click();
$("btnPdf").onclick = () => { if (pages.length) openExport(); };
for (const id of ["inCam", "inAlbum"]) $(id).addEventListener("change", e => { const f = [...e.target.files]; e.target.value = ""; addFiles(f); });
$("clearAll").onclick = async () => {
  if (!confirm(`清除全部 ${pages.length} 頁？清除後無法復原。`)) return;
  for (const p of pages) { if (p.url) URL.revokeObjectURL(p.url); await deletePage(p.id); }
  pages = []; renderList();
};
// drag & drop on desktop
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => { e.preventDefault(); if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files); });

(async function start() {
  const saved = (await dbDo("readonly", st => st.getAll())) || [];
  pages = saved.filter(p => p.out && p.src).sort((a, b) => a.order - b.order);
  pages.forEach(p => p.url = URL.createObjectURL(p.out));
  renderList();
})();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
