<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NotebookLM PDF → PPTX 轉換器</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #fff;
      border-radius: 1.25rem;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
      max-width: 520px;
      width: 100%;
      padding: 2.5rem 2rem;
      text-align: center;
    }

    .card h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: .5rem;
    }

    .card .subtitle {
      font-size: .95rem;
      color: #718096;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    /* Drop zone */
    .drop-zone {
      border: 2.5px dashed #a0aec0;
      border-radius: .85rem;
      padding: 2.5rem 1.5rem;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      position: relative;
    }
    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: #667eea;
      background: #f0f0ff;
    }
    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .drop-zone .icon {
      font-size: 3rem;
      margin-bottom: .75rem;
    }

    .drop-zone p {
      color: #4a5568;
      font-size: .95rem;
    }
    .drop-zone p strong {
      color: #667eea;
    }
    .drop-zone .hint {
      font-size: .8rem;
      color: #a0aec0;
      margin-top: .4rem;
    }

    /* File info */
    #file-info {
      margin-top: 1.25rem;
      font-size: .9rem;
      color: #2d3748;
      min-height: 1.4em;
    }

    /* Steps */
    .steps {
      display: flex;
      justify-content: space-around;
      margin: 1.75rem 0 1.5rem;
      gap: .5rem;
    }
    .step {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .35rem;
    }
    .step .badge {
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      background: #ebf4ff;
      color: #3182ce;
      font-weight: 700;
      font-size: .85rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .step span {
      font-size: .78rem;
      color: #718096;
      text-align: center;
      line-height: 1.3;
    }

    /* Button */
    button#convert-btn {
      margin-top: .25rem;
      width: 100%;
      padding: .85rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: .75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
    }
    button#convert-btn:hover:not(:disabled) { opacity: .9; }
    button#convert-btn:active:not(:disabled) { transform: scale(.98); }
    button#convert-btn:disabled { opacity: .5; cursor: not-allowed; }

    /* Status */
    #status {
      margin-top: 1.25rem;
      font-size: .9rem;
      min-height: 1.4em;
    }
    #status.error { color: #e53e3e; }
    #status.success { color: #38a169; }
    #status.processing { color: #3182ce; }

    /* Progress bar */
    #progress-wrap {
      margin-top: .85rem;
      background: #e2e8f0;
      border-radius: 9999px;
      height: 6px;
      overflow: hidden;
      display: none;
    }
    #progress-bar {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      width: 0;
      transition: width .3s ease;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📊 NotebookLM PDF → PPTX</h1>
    <p class="subtitle">上傳 NotebookLM 簡報 PDF，自動分離文字與圖層，<br>下載可編輯的 PowerPoint 檔案。</p>

    <div class="drop-zone" id="drop-zone">
      <input type="file" id="file-input" accept=".pdf" />
      <div class="icon">📄</div>
      <p><strong>點擊選擇</strong> 或拖曳 PDF 至此</p>
      <p class="hint">僅支援 .pdf 檔案，最大 50 MB</p>
    </div>

    <div id="file-info"></div>

    <div class="steps">
      <div class="step">
        <div class="badge">1</div>
        <span>上傳<br>PDF</span>
      </div>
      <div class="step">
        <div class="badge">2</div>
        <span>文字 &amp;<br>圖層分離</span>
      </div>
      <div class="step">
        <div class="badge">3</div>
        <span>下載<br>PPTX</span>
      </div>
    </div>

    <button id="convert-btn" disabled>轉換並下載 PPTX</button>

    <div id="progress-wrap"><div id="progress-bar"></div></div>
    <div id="status"></div>
  </div>

  <script>
    const dropZone = document.getElementById("drop-zone");
    const fileInput = document.getElementById("file-input");
    const fileInfo = document.getElementById("file-info");
    const convertBtn = document.getElementById("convert-btn");
    const status = document.getElementById("status");
    const progressWrap = document.getElementById("progress-wrap");
    const progressBar = document.getElementById("progress-bar");

    let selectedFile = null;

    function setFile(file) {
      if (!file || !file.name.toLowerCase().endsWith(".pdf")) {
        setStatus("error", "請選擇有效的 PDF 檔案。");
        return;
      }
      selectedFile = file;
      fileInfo.textContent = `已選擇：${file.name}（${(file.size / 1024).toFixed(1)} KB）`;
      convertBtn.disabled = false;
      setStatus("", "");
    }

    function setStatus(type, msg) {
      status.className = type;
      status.textContent = msg;
    }

    // Click to select
    fileInput.addEventListener("change", () => {
      if (fileInput.files[0]) setFile(fileInput.files[0]);
    });

    // Drag-and-drop
    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropZone.classList.add("dragover");
    });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
      const file = e.dataTransfer.files[0];
      if (file) { fileInput.files = e.dataTransfer.files; setFile(file); }
    });

    // Convert
    convertBtn.addEventListener("click", async () => {
      if (!selectedFile) return;

      convertBtn.disabled = true;
      setStatus("processing", "⏳ 正在處理，請稍候…");
      progressWrap.style.display = "block";

      // Animate indeterminate progress
      let pct = 0;
      const ticker = setInterval(() => {
        pct = Math.min(pct + Math.random() * 8, 85);
        progressBar.style.width = pct + "%";
      }, 400);

      try {
        const formData = new FormData();
        formData.append("file", selectedFile);

        const resp = await fetch("/upload", { method: "POST", body: formData });

        clearInterval(ticker);
        progressBar.style.width = "100%";

        if (!resp.ok) {
          const err = await resp.json().catch(() => ({ error: "未知錯誤" }));
          throw new Error(err.error || `HTTP ${resp.status}`);
        }

        // Trigger download
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        const disposition = resp.headers.get("Content-Disposition") || "";
        const match = disposition.match(/filename\*?=(?:UTF-8'')?([^;]+)/i);
        a.download = match ? decodeURIComponent(match[1].replace(/"/g, "")) : "output.pptx";
        a.href = url;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        setStatus("success", "✅ 轉換完成！檔案已開始下載。");
      } catch (err) {
        clearInterval(ticker);
        progressBar.style.width = "0";
        setStatus("error", "❌ 錯誤：" + err.message);
      } finally {
        setTimeout(() => {
          progressWrap.style.display = "none";
          progressBar.style.width = "0";
          convertBtn.disabled = false;
        }, 1500);
      }
    });
  </script>
</body>
</html>
