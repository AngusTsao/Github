  { kind: "quiz", q: "長期餵食，卻沒有幫貓絕育，最可能造成什麼問題？", opts: ["貓的數量不斷增加", "貓會變得比較親人", "貓會自己離開", "不會有任何影響"], ans: [0],

const PLEDGES = ["我不棄養，也不讓家貓在外放養", "我會以領養代替購買", "我支持並協助 TNSA", "我不隨意餵食街頭的貓", "我會把今天學到的分享給一個人"];

const AGES = ["12歲以下", "13–18歲", "19–24歲", "25–34歲", "35–44歲", "45–54歲", "55–64歲", "65歲以上"];
const REGIONS = ["基隆市", "臺北市", "新北市", "桃園市", "新竹市", "新竹縣", "苗栗縣", "臺中市", "彰化縣", "南投縣", "雲林縣", "嘉義市", "嘉義縣", "臺南市", "高雄市", "屏東縣", "宜蘭縣", "花蓮縣", "臺東縣", "澎湖縣", "金門縣", "連江縣", "海外"];
const LETTERS = "ABCDE";
// 每局最多 10 題：從題庫隨機抽 3 題心理測驗 + 7 題知識題，再打亂順序
const MAX_STEPS = 10, MIND_PER_GAME = 3;
// 展場模式：閒置 90 秒跳出提醒，再 15 秒沒動作就回到首頁
const IDLE_MS = 90000, IDLE_COUNTDOWN = 15;

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function drawOrder() {
  const idx = k => STEPS.map((s, i) => s.kind === k && !s.retired ? i : -1).filter(i => i >= 0);
  const mind = shuffle(idx("mind")).slice(0, MIND_PER_GAME);
  const quiz = shuffle(idx("quiz")).slice(0, MAX_STEPS - mind.length);
  return shuffle([...mind, ...quiz]);
}
const cur = () => STEPS[S.order[S.i]];
const quizCount = () => S.order.filter(i => STEPS[i].kind === "quiz").length;
const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let S = fresh();
function fresh() { return { screen: "intro", order: drawOrder(), i: 0, picked: [], revealed: false, correct: 0, tally: { T: 0, A: 0, E: 0, S: 0 }, pledges: [], words: "", posted: "", nick: "", age: "", region: "", answers: {}, minds: {}, playerId: "" }; }

const $ = id => document.getElementById(id);
const screenEl = $("screen"), actionsEl = $("actions");

function go(screen) { S.screen = screen; render(true); }

function render(enter) {
  const view = { intro: viewIntro, profile: viewProfile, play: viewStep, pledge: viewPledge, result: viewResult }[S.screen]();
  screenEl.innerHTML = `<div class="inner ${enter ? "enter" : ""} ${view.cls || ""}">${view.body}</div>`;
  actionsEl.innerHTML = view.actions;
  if (enter) screenEl.scrollTop = 0;

  const playing = S.screen === "play";
  const total = S.order.length;
  $("count").innerHTML = playing ? `<b>${S.i + 1}</b> / ${total}` : (S.screen === "intro" || S.screen === "profile") ? "" : "完成";
  $("barfill").style.width = (playing ? (S.i + (S.revealed ? 1 : 0)) / total * 100 : (S.screen === "intro" || S.screen === "profile") ? 0 : 100) + "%";
  $("home").hidden = S.screen === "intro";
  view.bind && view.bind();
}

function viewIntro() {

    body: `

        ${CAT_SVG}
      </div>
      <p class="notch-note">看看這隻貓的<b>左耳</b>，少了一角。這是「已絕育」的記號：在街頭看到剪耳的貓，代表牠已經結紮過了，可以聯繫動保團體協助安置與送養。</p>

}

const profileReady = () => S.nick.trim().length > 0 && AGES.includes(S.age) && REGIONS.includes(S.region);

function viewProfile() {
  return {
    body: `
    <section class="card">
      <span class="eyebrow">開始之前</span>
      <h2>先認識一下你</h2>
      <div class="fields">
        <div class="field">
          <label for="nick">暱稱<small>會顯示在承諾卡和留言牆上</small></label>
          <input id="nick" maxlength="12" autocomplete="off" enterkeyhint="done" placeholder="例如：橘子貓奴" value="${esc(S.nick)}">
        </div>
        <div class="field">
          <label id="age-label">年齡</label>
          <div class="ages" role="group" aria-labelledby="age-label">${AGES.map(a => `<button type="button" data-age="${a}" aria-pressed="${S.age === a}">${a}</button>`).join("")}</div>
        </div>
        <div class="field">
          <label for="region">居住地區</label>
          <select id="region"><option value="">請選擇縣市</option>${REGIONS.map(r => `<option ${S.region === r ? "selected" : ""}>${r}</option>`).join("")}</select>
        </div>
      </div>
    </section>`,
    actions: `<button class="btn" id="go" ${profileReady() ? "" : "disabled"}>開始測驗</button>`,
    bind() {
      const sync = () => { $("go").disabled = !profileReady(); };
      $("nick").oninput = e => { S.nick = e.target.value; sync(); };
      $("nick").onkeydown = e => { if (e.key === "Enter") e.target.blur(); };
      $("region").onchange = e => { S.region = e.target.value; sync(); };
      screenEl.querySelectorAll("[data-age]").forEach(b => b.onclick = () => {
        S.age = b.dataset.age;
        screenEl.querySelectorAll("[data-age]").forEach(x => x.setAttribute("aria-pressed", x === b));
        sync();
      });
      $("go").onclick = () => { if (profileReady()) { S.nick = S.nick.trim(); go("play"); } };
    }
  };
}

function viewStep() {
  const st = cur();
  const isQuiz = st.kind === "quiz", multi = isQuiz && st.multi;
  const head = multi
    ? `<div class="multi-banner"><span class="big">複選題</span><span>答案不只一個！全部選好後，按下方「確認答案」</span></div>`
    : `<span class="tag ${isQuiz ? "quiz" : "mind"}">${isQuiz ? (st.tnvr ? "TNSA 解碼" : "知識題") : "心理測驗・憑直覺選"}</span>`;
  const opts = (isQuiz ? st.opts.map(o => [o]) : st.opts).map((o, k) => {
    let cls = "opt" + (multi ? " multi" : "");
    if (S.picked.includes(k)) cls += " picked";
    if (S.revealed && isQuiz) { if (st.ans.includes(k)) cls += " right"; else if (S.picked.includes(k)) cls += " wrong"; }
    const box = multi ? `<span class="box" aria-hidden="true">${S.picked.includes(k) ? "✓" : ""}</span>` : "";
    return `<button class="${cls}" data-k="${k}" ${multi ? `role="checkbox" aria-checked="${S.picked.includes(k)}"` : ""} ${S.revealed ? "disabled" : ""}>${box}<span class="k">${LETTERS[k]}</span><span>${esc(o[0])}</span></button>`;
  }).join("");

  const ok = isQuiz && S.revealed && sameSet(S.picked, st.ans);
  const explain = isQuiz && S.revealed && !ok
    ? `<div class="explain miss pop" id="explain"><strong>正確答案是 ${st.ans.map(k => LETTERS[k]).join("、")}</strong><p>${esc(st.ex)}</p></div>` : "";

  let actions;
  if (S.revealed && !isQuiz) actions = `<div class="action-hint">收到！</div>`;
  else if (S.revealed && ok) actions = `<div class="action-hint ok pop">答對了！</div>`;
  else if (S.revealed) actions = `<button class="btn" id="next">繼續</button>`;
  else if (multi) actions = `<button class="btn" id="check" ${S.picked.length ? "" : "disabled"}>確認答案${S.picked.length ? `（已選 ${S.picked.length} 個）` : ""}</button>`;
  else actions = `<div class="action-hint">${isQuiz ? "點選一個答案" : "沒有對錯，選最像你的那一個"}</div>`;

  return {
    cls: multi ? "is-multi" : "",
    body: `<section class="card">${head}<h2>${esc(st.q)}</h2><div class="opts">${opts}</div>${explain}</section>`,
    actions,
    bind() {
      screenEl.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.k));
      if ($("check")) $("check").onclick = reveal;
      if ($("next")) $("next").onclick = next;
      if ($("explain")) $("explain").scrollIntoView({ block: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    }
  };
}

function pick(k) {
  const st = cur();
  if (st.kind === "mind") { S.tally[st.opts[k][1]]++; S.minds[S.order[S.i]] = st.opts[k][1]; S.picked = [k]; S.revealed = true; render(); advanceLater(280); return; }
  if (st.multi) { S.picked = S.picked.includes(k) ? S.picked.filter(x => x !== k) : [...S.picked, k]; render(); return; }
  S.picked = [k]; reveal();
}
// 答對：短暫顯示綠色後自動往下；答錯：顯示正確答案與解說，按「繼續」
function reveal() {
  S.revealed = true;
  const ok = sameSet(S.picked, cur().ans);
  if (ok) S.correct++;
  S.answers[S.order[S.i]] = ok ? 1 : 0;
  render();
  if (ok) advanceLater(950);
}
function advanceLater(ms) {
  const at = S.i;
  setTimeout(() => { if (S.screen === "play" && S.i === at && S.revealed) next(); }, ms);
}
function next() {
  S.picked = []; S.revealed = false;
  if (S.i < S.order.length - 1) { S.i++; render(true); } else { recordPlayer(); go("pledge"); }
}

const topType = () => Object.keys(S.tally).reduce((best, k) => S.tally[k] > S.tally[best] ? k : best, "T");

/* ---------- GitHub Pages 版：用 Google 試算表（Apps Script）當資料庫 ----------
   只在 claude.ai 的資料庫不存在、且 config.js 設定了 sheetApi 時啟用。
   提供與 claude.ai db 相同的一小組介面：collection().doc().set/update、doc().delete、onSnapshot（輪詢）。 */
function sheetDB(api) {
  const KEY = "catquiz-admin-key";
  const getKey = () => { try { return localStorage.getItem(KEY) || ""; } catch (e) { return ""; } };
  const post = async body => {
    const r = await fetch(api, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!j.ok) throw { code: j.error || "unavailable" };
    return j;
  };
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  const ref = (col, id) => ({
    id,
    set: data => post({ action: "set", col, id, data }),
    update: data => post({ action: "update", col, id, data }),
    delete: () => post({ action: "delete", col, id, key: getKey() })
  });
  const query = col => {
    const q = {
      orderBy: () => q, limit: () => q,
      onSnapshot(next, err) {
        let stop = false, ok = false, timer = 0;
        const tick = async () => {
          try {
            const url = api + (api.includes("?") ? "&" : "?") + "col=" + col + (col === "players" ? "&key=" + encodeURIComponent(getKey()) : "") + "&t=" + Date.now();
            const j = await (await fetch(url)).json();
            if (j.error) { if (!stop) { stop = true; err && err({ code: j.error }); } return; }
            ok = true;
            if (!stop) next({ docs: (j.docs || []).map(d => ({ id: d.id, data: () => d.data })) });
          } catch (e) {
            if (!ok && !stop) { stop = true; err && err({ code: "unavailable" }); return; }
          }
          if (!stop) timer = setTimeout(tick, col === "players" ? 30000 : 8000);
        };
        tick();
        return () => { stop = true; clearTimeout(timer); };
      }
    };
    return q;
  };
  // 連線測試：確認網址是可公開存取的 cat-quiz Apps Script
  const ping = async () => {
    let j;
    try { j = await (await fetch(api + (api.includes("?") ? "&" : "?") + "t=" + Date.now())).json(); }
    catch (e) { return { ok: false, why: "unreachable" }; }
    if (j && j.service === "cat-quiz" && j.ok) return { ok: true, version: j.version || 1, sheetName: j.sheetName, sheetUrl: j.sheetUrl };
    if (j && j.error === "server_error") return { ok: false, why: "server", message: j.message };
    return { ok: false, why: "wrong_script" };
  };
  return {
    kind: "sheet", getKey, ping,
    setKey(k) { try { localStorage.setItem(KEY, k); } catch (e) {} },
    collection: col => Object.assign(query(col), { doc: id => ref(col, id || newId()) }),
    doc: path => { const [c, i] = path.split("/"); return ref(c, i); }
  };
}

/* ---------- 每位玩家的作答紀錄（統計用，不含暱稱） ---------- */
let recordP = Promise.resolve();
function recordPlayer() {
  if (!DB || S.playerId) return;
  const ref = DB.collection("players").doc();
  S.playerId = ref.id;
  recordP = ref.set({
    age: S.age, region: S.region, type: topType(), correct: S.correct, total: quizCount(),
    answers: S.answers, minds: S.minds, pledges: [], message: false, ts: Date.now()
  }).catch(() => { S.playerId = ""; });
}
async function updatePlayer() {
  if (!DB || !S.playerId) return;
  try {
    await recordP;
    if (S.playerId) await DB.doc("players/" + S.playerId).update({ pledges: S.pledges.slice().sort(), message: !!S.words.trim() });
  } catch (e) {}
}

/* ---------- 統計分析頁 ---------- */
let DOWNLOADS = null, statsUnsub = null, statsDocs = null, statsErr = false, statsAuthErr = false, statsDate = "";
const dayKey = ts => { const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;

function startStats() {
  if (statsUnsub || !DB) return;
  statsUnsub = DB.collection("players").orderBy("ts", "desc").limit(1000).onSnapshot(
    snap => { statsDocs = snap.docs.map(d => d.data() || {}).filter(v => typeof v.ts === "number"); statsErr = false; drawStats(); },
    e => { if (e && e.code === "unauthorized") statsAuthErr = true; else statsErr = true; statsUnsub = null; drawStats(); }
  );
}
$("stats-date").onchange = e => { statsDate = e.target.value; drawStats(); };

function barList(rows, { max, fmt, cls = "" }) {
  const m = max ?? Math.max(1, ...rows.map(r => r.v));
  return `<div class="bars ${cls}">${rows.map(r => `
    <div class="brow" title="${esc(r.tip || `${r.label}：${fmt(r)}`)}">
      <span class="lab">${r.labelHtml || esc(r.label)}</span>
      <div class="track"><div class="fill${r.v > 0 ? " some" : ""}" style="width:${(r.v / m * 100).toFixed(1)}%"></div></div>
      <span class="val">${fmt(r)}</span>
    </div>`).join("")}</div>`;
}

let pingState = null;
function runPing() {
  if (pingState || DB?.kind !== "sheet") return;
  pingState = { checking: true };
  DB.ping().then(r => { pingState = r; if (isStats()) drawStats(); });
}
function pingHtml() {
  if (DB?.kind !== "sheet" || !pingState) return "";
  const p = pingState;
  let msg, color = "var(--miss)";
  if (p.checking) { msg = "正在測試 Google 試算表連線⋯⋯"; color = "var(--muted)"; }
  else if (p.ok) {
    color = "var(--leaf)";
    msg = `Google 試算表連線正常${p.sheetName ? `：「${esc(p.sheetName)}」` : ""}${p.sheetUrl && /^https:\/\/docs\.google\.com\//.test(p.sheetUrl) ? `　<a href="${esc(p.sheetUrl)}" target="_blank" rel="noopener" style="color:inherit">打開試算表</a>` : ""}${p.version < 2 ? "<br>（Apps Script 是舊版，建議貼上最新的 apps-script.gs 並重新部署新版本）" : ""}`;
  }
  else if (p.why === "unreachable") msg = "連不到 Google Apps Script。請到 Apps Script「部署 → 管理部署作業」確認：類型是「網頁應用程式」、執行身分是「我」、誰可以存取是「<b>所有人</b>」，並確認 config.js 的網址是以 /exec 結尾的那一個。";
  else if (p.why === "server") msg = `Apps Script 執行時發生錯誤：${esc(p.message || "")}`;
  else msg = "這個網址部署的不是本測驗的程式。請把 cat-quiz/apps-script.gs 的內容貼進 Apps Script，再「部署 → 管理部署作業 → 編輯 → 版本選『新版本』→ 部署」。";
  return `<div style="border:1.5px solid ${color};color:${color};border-radius:14px;padding:12px 16px;font-size:15px;line-height:1.6">${msg}</div>`;
}

function drawStats() {
  const body = $("stats-body");
  runPing();
  $("stats-csv").hidden = !((DOWNLOADS || DB?.kind === "sheet") && statsDocs && statsDocs.length && !statsAuthErr);
  if (DB?.kind === "sheet" && (!CAN_EDIT || statsAuthErr)) {
    body.innerHTML = pingHtml() + `<form class="stats-empty" id="key-form" style="display:flex;flex-direction:column;gap:12px;align-items:center">
      <b style="font-family:var(--display);font-weight:400;font-size:22px;color:var(--ink)">請輸入管理密碼</b>
      <span>就是你在 Google Apps Script 裡設定的 ADMIN_KEY。</span>
      <input id="admin-key" type="password" autocomplete="current-password" style="font:inherit;font-size:17px;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);padding:0 14px;width:min(100%,320px);box-sizing:border-box">
      ${statsAuthErr ? `<span style="color:var(--miss)">密碼不正確，請再試一次。</span>` : ""}
      <button class="btn small" type="submit">查看統計</button>
    </form>`;
    $("key-form").onsubmit = e => {
      e.preventDefault();
      const k = $("admin-key").value.trim();
      if (!k) return;
      DB.setKey(k); CAN_EDIT = true; statsAuthErr = false; statsDocs = null;
      if (statsUnsub) statsUnsub(); statsUnsub = null;
      $("to-wall").hidden = $("to-stats").hidden = false;
      startStats(); drawStats();
    };
    return;
  }
  if (!CAN_EDIT || !DB) { body.innerHTML = `<div class="stats-empty">${!DB ? "統計用的資料庫還沒有設定好，或這台裝置沒有權限。" : "只有這個頁面的擁有者或編輯者可以查看統計。"}</div>`; return; }
  if (statsErr) { body.innerHTML = pingHtml() + `<div class="stats-empty">資料暫時連不上，請重新整理頁面。</div>`; return; }
  if (!statsDocs) { body.innerHTML = `<div class="stats-empty">載入資料中⋯⋯</div>`; return; }

  // 日期選單
  const days = [...new Set(statsDocs.map(v => dayKey(v.ts)))].sort().reverse();
  if (statsDate && !days.includes(statsDate)) statsDate = "";
  $("stats-date").innerHTML = `<option value="">全部日期（${statsDocs.length} 人）</option>` +
    days.map(d => `<option value="${d}" ${d === statsDate ? "selected" : ""}>${d}（${statsDocs.filter(v => dayKey(v.ts) === d).length} 人）</option>`).join("");

  const rows = statsDate ? statsDocs.filter(v => dayKey(v.ts) === statsDate) : statsDocs;
  $("stats-sub").textContent = `資料即時更新・${statsDate || "全部日期"}・共 ${rows.length} 位玩家完成測驗` + (statsDocs.length >= 1000 ? "（僅顯示最近 1000 筆）" : "");
  if (!rows.length) { body.innerHTML = `<div class="stats-empty">還沒有人玩完測驗。玩家完成 10 題後，資料就會出現在這裡。</div>`; return; }

  const n = rows.length;
  const sumC = rows.reduce((a, v) => a + (+v.correct || 0), 0), sumT = rows.reduce((a, v) => a + (+v.total || 0), 0);
  const msgs = rows.filter(v => v.message).length;
  const count = (key, list) => list.map(k => ({ label: k, v: rows.filter(v => v[key] === k).length }));

  const ageRows = count("age", AGES);
  const regionRows = count("region", REGIONS).filter(r => r.v).sort((a, b) => b.v - a.v);
  const typeRows = Object.keys(TYPES).map(k => ({ label: TYPES[k].name, v: rows.filter(v => v.type === k).length }));
  const hourRows = [];
  const hours = rows.map(v => new Date(v.ts).getHours());
  for (let h = Math.min(...hours); h <= Math.max(...hours); h++) hourRows.push({ label: `${String(h).padStart(2, "0")}:00`, v: hours.filter(x => x === h).length });

  const ageAcc = AGES.map(a => { const g = rows.filter(v => v.age === a); const c = g.reduce((s, v) => s + (+v.correct || 0), 0), t = g.reduce((s, v) => s + (+v.total || 0), 0); return { label: a, v: pct(c, t), n: g.length }; }).filter(r => r.n);

  const qRows = [];
  STEPS.forEach((st, i) => {
    if (st.kind !== "quiz") return;
    const got = rows.map(v => v.answers && v.answers[i]).filter(x => x === 0 || x === 1);
    if (!got.length) return;
    const ok = got.filter(x => x === 1).length;
    qRows.push({ label: st.q, v: pct(ok, got.length), n: got.length, labelHtml: `${esc(st.q)} <small>（${st.retired ? "已停用・" : ""}${st.multi ? "複選・" : ""}${got.length} 人作答）</small>` });
  });
  qRows.sort((a, b) => a.v - b.v);

  const pledgeRows = PLEDGES.map((p, k) => ({ label: p, v: pct(rows.filter(v => Array.isArray(v.pledges) && v.pledges.includes(k)).length, n), raw: rows.filter(v => Array.isArray(v.pledges) && v.pledges.includes(k)).length }));

  const people = r => `<b>${r.v}</b> 人`;
  body.innerHTML = `
    <div class="kpis">
      <div class="kpi"><span>完成測驗人數</span><b>${n}</b></div>
      <div class="kpi"><span>平均答對率</span><b>${pct(sumC, sumT)}%</b><small>共 ${sumT} 題次</small></div>
      <div class="kpi"><span>留言上牆</span><b>${msgs}</b><small>佔 ${pct(msgs, n)}%</small></div>
      <div class="kpi"><span>最多人的地區</span><b style="font-size:26px">${regionRows[0] ? esc(regionRows[0].label) : "—"}</b><small>${regionRows[0] ? regionRows[0].v + " 人" : ""}</small></div>
    </div>
    <div class="panels">
      <section class="panel"><h3>年齡分布</h3>${barList(ageRows, { fmt: people })}</section>
      <section class="panel"><h3>居住地區</h3>${barList(regionRows, { fmt: people })}</section>
      <section class="panel"><h3>守護者類型</h3>${barList(typeRows, { fmt: r => `<b>${r.v}</b> 人・${pct(r.v, n)}%` })}</section>
      <section class="panel"><h3>各年齡平均答對率</h3><p class="note-line">只列出有人參與的年齡層</p>${barList(ageAcc, { max: 100, cls: "pct", fmt: r => `<b>${r.v}%</b>・${r.n}人` })}</section>
      <section class="panel"><h3>參與時段</h3>${barList(hourRows, { fmt: people })}</section>
      <section class="panel"><h3>承諾勾選比例</h3>${barList(pledgeRows.map(r => ({ ...r })), { max: 100, cls: "pct", fmt: r => `<b>${r.v}%</b>・${r.raw}人` })}</section>
      <section class="panel full"><h3>各題答對率</h3><p class="note-line">由低到高排列，排在最上面的是最多人答錯、最需要加強宣導的觀念</p>${barList(qRows, { max: 100, cls: "pct wide", fmt: r => `<b>${r.v}%</b> 答對` })}</section>
    </div>`;
}

$("stats-csv").onclick = async () => {
  const rows = statsDate ? statsDocs.filter(v => dayKey(v.ts) === statsDate) : statsDocs;
  const quizIdx = STEPS.map((s, i) => s.kind === "quiz" ? i : -1).filter(i => i >= 0);
  const head = ["時間", "年齡", "居住地區", "守護者類型", "答對題數", "作答知識題數", "答對率", "承諾項目", "有留言", ...quizIdx.map((i, k) => `Q${k + 1} ${STEPS[i].q}`)];
  const cell = x => { const t = String(x ?? ""); return /[",\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const lines = rows.slice().sort((a, b) => a.ts - b.ts).map(v => {
    const d = new Date(v.ts);
    return [
      `${dayKey(v.ts)} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`,
      AGES.includes(v.age) ? v.age : "", REGIONS.includes(v.region) ? v.region : "", TYPES[v.type] ? TYPES[v.type].name : "",
      +v.correct || 0, +v.total || 0, pct(+v.correct || 0, +v.total || 0) + "%",
      (Array.isArray(v.pledges) ? v.pledges : []).map(k => PLEDGES[k]).filter(Boolean).join("；"), v.message ? "是" : "否",
      ...quizIdx.map(i => v.answers && (v.answers[i] === 1 ? "對" : v.answers[i] === 0 ? "錯" : ""))
    ].map(cell).join(",");
  });
  const csv = "﻿" + [head.map(cell).join(","), ...lines].join("\r\n");
  const filename = `巷口的貓-統計-${statsDate || "全部"}.csv`;
  if (DOWNLOADS) { try { await DOWNLOADS.save({ filename, data: csv }); } catch (e) {} return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = `cat-quiz-stats-${statsDate || "all"}.csv`; // 英文檔名：部分瀏覽器會丟掉中文的下載檔名
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};

const isWall = () => location.hash === "#wall";
let wallUnsub = null, wallDocs = null, wallErr = false;
const seen = new Set();
let firstWallDraw = true;

const isStats = () => location.hash === "#stats";
function route() {
  const w = isWall(), st = isStats();
  document.querySelector(".shell").hidden = w || st;
  $("wall").hidden = !w;
  $("stats").hidden = !st;
  if (w) { startWall(); drawWall(); }
  if (st) { startStats(); drawStats(); }
}
addEventListener("hashchange", route);
$("to-wall").onclick = () => { location.hash = "wall"; };
$("to-stats").onclick = () => { location.hash = "stats"; };
$("stats-back").onclick = () => { history.replaceState(null, "", location.pathname + location.search); route(); };
$("wall-back").onclick = () => { history.replaceState(null, "", location.pathname + location.search); route(); };

function startWall() {
  if (wallUnsub || !DB) return;
  wallUnsub = DB.collection("messages").orderBy("ts", "desc").limit(40).onSnapshot(
    snap => { wallDocs = snap.docs; wallErr = false; drawWall(); },
    () => { wallErr = true; wallUnsub = null; drawWall(); }
  );
}

function drawWall() {
  const box = $("notes");
  box.textContent = "";
  $("wall-count").textContent = wallDocs && wallDocs.length ? `${wallDocs.length} 則留言` : "";
  if (!DB || wallErr || !wallDocs || !wallDocs.length) {
    const e = document.createElement("div");
    e.className = "wall-empty";
    const b = document.createElement("b"), p = document.createElement("span");
    if (!DB) { b.textContent = "這台裝置讀不到留言牆"; p.textContent = "留言牆的資料庫還沒有設定好，或這台裝置沒有權限。"; }
    else if (wallErr) { b.textContent = "留言牆暫時連不上"; p.textContent = "請重新整理頁面再試一次。"; }
    else if (!wallDocs) { b.textContent = "載入留言中⋯⋯"; p.textContent = ""; }
    else { b.textContent = "還沒有人留言"; p.textContent = "玩完測驗、寫下想說的一句話，就會出現在這裡。"; }
    e.append(b, p); box.append(e);
    return;
  }
  const wrap = document.createElement("div");
  wrap.className = "notes";
  for (const d of wallDocs) {
    const v = d.data() || {};
    const words = typeof v.words === "string" ? v.words.slice(0, 60) : "";
    if (!words) continue;
    const n = document.createElement("article");
    n.className = "note" + (words.length <= 16 ? " short" : "") + (!firstWallDraw && !seen.has(d.id) ? " new" : "");
    seen.add(d.id);
    const q = document.createElement("q"); q.textContent = words;
    const who = document.createElement("div"); who.className = "who";
    const t = document.createElement("span");
    const nick = typeof v.nick === "string" ? v.nick.slice(0, 12) : "";
    const region = REGIONS.includes(v.region) ? v.region : "";
    t.textContent = [nick ? "— " + nick : "", region, TYPES[v.type] ? TYPES[v.type].name : "貓咪守護者"].filter(Boolean).join("・");
    who.append(t);
    if (CAN_EDIT) {
      const h = document.createElement("button");
      h.className = "hide-btn"; h.textContent = "移除";
      h.onclick = () => { h.disabled = true; DB.doc("messages/" + d.id).delete().catch(() => { h.disabled = false; }); };
      who.append(h);
    }
    n.append(q, who); wrap.append(n);
  }
  firstWallDraw = false;
  box.append(wrap);
}

(async () => {
  [DB, USER] = await Promise.all([use("db"), use("user")]);
  const sheetApi = window.CAT_QUIZ_CONFIG && window.CAT_QUIZ_CONFIG.sheetApi;
  if (!DB && sheetApi) { DB = sheetDB(sheetApi); CAN_EDIT = !!DB.getKey(); }
  else { try { CAN_EDIT = USER ? await USER.canEdit() : false; } catch (e) { CAN_EDIT = false; } }
  $("to-wall").hidden = !(DB && CAN_EDIT);
  $("to-stats").hidden = !(DB && CAN_EDIT);
  DOWNLOADS = await use("downloads");
  route();
  if (S.screen === "pledge") render();
})();
$("home").onclick = reset;

/* 全螢幕（瀏覽器支援時才顯示按鈕） */
const fsBtn = $("fs");
if (document.fullscreenEnabled) {
  fsBtn.hidden = false;
  fsBtn.onclick = () => {
    const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    p && p.catch && p.catch(() => {});
  };
  $("wall-fs").hidden = false;
  $("wall-fs").onclick = fsBtn.onclick;
}

/* 螢幕常亮：展場平板不會自動休眠 */
let lock = null;
function keepAwake() { try { navigator.wakeLock?.request("screen").then(l => lock = l).catch(() => {}); } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && lock) keepAwake(); });

/* 閒置自動回首頁 */
let lastAct = Date.now(), countdown = 0;
const idleEl = $("idle");
["pointerdown", "keydown", "input", "wheel", "touchstart"].forEach(ev => addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true }));
function hideIdle() { idleEl.hidden = true; countdown = 0; lastAct = Date.now(); }
$("idle-stay").onclick = hideIdle;
setInterval(() => {
  if (S.screen === "intro" || isWall() || isStats()) return;
  if (!idleEl.hidden) {
    countdown--; $("idle-num").textContent = countdown;
    if (countdown <= 0) reset();
  } else if (Date.now() - lastAct > IDLE_MS) {
    countdown = IDLE_COUNTDOWN; $("idle-num").textContent = countdown; idleEl.hidden = false;
  }
}, 1000);

window.claude?.hot?.snapshot?.(() => S);
function start(data) {
  if (data && data.screen && Array.isArray(data.order)) S = Object.assign(fresh(), data);
  route(); render();
  if (S.screen === "play" && S.revealed && (cur().kind === "mind" || sameSet(S.picked, cur().ans))) advanceLater(300);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
