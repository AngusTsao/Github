<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<title>尾牙報到 QR Code</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#A8261B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23A8261B'/%3E%3Cpath d='M18 33l9 9 19-20' fill='none' stroke='%23F3D27A' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="config.js"></script>
<script src="vendor/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 員工個人票券 — 紅色頁首帶活動名稱，下方一張白色票卡：QR Code（永遠白底，掃描最穩）＋座位資訊。 */
:root {
  --bg: #F7F2EA; --card: #FFFDF9; --ink: #241B16; --muted: #6E625A; --line: #E4DAD0;
  --brand: #A8261B; --gold: #F3D27A; --ok: #1F7A45; --ok-soft: #DDF1E4; --veg: #2E7D32;
  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17120F; --card: #221B17; --ink: #F1E9E1; --muted: #B3A69C; --line: #3A2F29;
  --brand: #8E1F16; --ok: #5CCB8A; --ok-soft: #173826; --veg: #7BD67F; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #17120F; --card: #221B17; --ink: #F1E9E1; --muted: #B3A69C; --line: #3A2F29;
  --brand: #8E1F16; --ok: #5CCB8A; --ok-soft: #173826; --veg: #7BD67F; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
[hidden] { display: none !important; }
.head { background: var(--brand); color: #fff; padding: calc(28px + env(safe-area-inset-top, 0px)) 16px 76px; text-align: center; }
.head .k { color: var(--gold); font-weight: 700; letter-spacing: .2em; font-size: 13px; }
.head h1 { margin: 6px 0 0; font-size: 26px; font-weight: 900; }
.ticket { max-width: 420px; margin: -56px auto 32px; padding: 0 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 22px 20px; box-shadow: 0 10px 30px rgba(0,0,0,.08); text-align: center; }
.qr { background: #fff; border-radius: 14px; padding: 14px; width: min(100%, 300px); margin: 0 auto; }
.qr svg { display: block; width: 100%; height: auto; }
.code { margin-top: 8px; font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: .15em; color: var(--muted); font-size: 14px; }
.name { margin: 18px 0 2px; font-size: 30px; font-weight: 900; }
.dept { color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 18px; }
.fact { border: 1px solid var(--line); border-radius: 12px; padding: 8px 6px; }
.fact span { display: block; font-size: 12px; color: var(--muted); }
.fact b { display: block; font-size: 22px; font-weight: 900; word-break: break-all; }
.fact.veg b { color: var(--veg); }
.done { margin-top: 16px; background: var(--ok-soft); color: var(--ok); border-radius: 12px; padding: 10px; font-weight: 700; }
.tips { margin: 18px 4px 0; padding: 0; list-style: none; color: var(--muted); font-size: 14px; line-height: 1.7; text-align: left; }
.tips li::before { content: "・"; }
.err { text-align: center; padding: 12px 4px; line-height: 1.7; }
.err h2 { margin: 0 0 6px; font-size: 20px; }
</style>
</head>
<body>
<header class="head">
  <div class="k">報到 QR CODE</div>
  <h1 id="ev">尾牙</h1>
</header>
<main class="ticket">
  <div class="card" id="card">
    <div id="ok" hidden>
      <div class="qr" id="qr" role="img" aria-label="報到 QR Code"></div>
      <div class="code" id="code"></div>
      <div id="info" hidden>
        <div class="name" id="name"></div>
        <div class="dept" id="dept"></div>
        <div class="facts">
          <div class="fact"><span>桌號</span><b id="table">—</b></div>
          <div class="fact" id="mealBox"><span>餐點</span><b id="meal">—</b></div>
          <div class="fact"><span>抽獎編號</span><b id="lottery">—</b></div>
        </div>
        <div class="done" id="done" hidden></div>
      </div>
      <ul class="tips">
        <li>報到時請出示這個畫面，並把螢幕亮度調高。</li>
        <li>可以先截圖存在手機相簿，現場沒網路也能用。</li>
        <li>QR Code 掃不到時，向工作人員報上員工編號或姓名即可。</li>
      </ul>
    </div>
    <div class="err" id="bad" hidden>
      <h2>找不到報到代碼</h2>
      <p>請從報到信裡的連結重新開啟這一頁。<br>若仍有問題，請洽活動負責人。</p>
    </div>
  </div>
</main>
<script>
const CFG = window.YEP_CONFIG || {};
const EVENT = CFG.eventName || "尾牙";
const API = (CFG.sheetApi || "").trim();
const $ = id => document.getElementById(id);
document.getElementById("ev").textContent = EVENT;
document.title = EVENT + " 報到 QR Code";

const token = (new URLSearchParams(location.search).get("t") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
if (!token) {
  $("bad").hidden = false;
} else {
  const qr = qrcode(0, "M");
  qr.addData(token);
  qr.make();
  $("qr").innerHTML = qr.createSvgTag({ cellSize: 8, margin: 16, scalable: true });
  $("code").textContent = token;
  $("ok").hidden = false;
  if (API) loadInfo();
}

async function loadInfo() {
  try {
    const j = await (await fetch(API + (API.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(token))).json();
    if (!j.ok) return;
    if (!j.found) { $("ok").hidden = true; $("bad").hidden = false; return; }
    const e = j.employee;
    $("name").textContent = e.name;
    $("dept").textContent = [e.dept, e.id && "員編 " + e.id].filter(Boolean).join("・");
    $("table").textContent = e.table || "—";
    $("meal").textContent = e.meal || "—";
    $("lottery").textContent = e.lottery || "—";
    $("mealBox").classList.toggle("veg", /素/.test(e.meal || ""));
    if (j.checkedIn) { $("done").hidden = false; const m = j.checkedIn.match(/(\d{1,2}:\d{2})(:\d{2})?\s*$/); $("done").textContent = "已完成報到" + (m ? "（" + m[1] + "）" : ""); }
    $("info").hidden = false;
  } catch (err) {
    // 沒網路時照樣顯示 QR Code，只是沒有座位資訊
  }
}
</script>
</body>
</html>
